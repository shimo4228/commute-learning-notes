<text data-step="2" x="615" y="630" text-anchor="middle" font-family="Noto Sans CJK JP" font-weight="500" font-size="44" fill="#242321">打ち手</text>
<polyline data-step="3" points="805,540 880,540 880,290 812,290" fill="none" stroke="#242321" stroke-width="5" marker-end="url(#ai)"/>
