<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
<defs>
<marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#242321"/></marker>
<marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2148B8"/></marker>
</defs>
<rect width="1200" height="1200" fill="#FAFAF7"/>
<text x="80" y="100" font-family="Noto Sans CJK JP" font-size="30" fill="#2148B8">判断と測定　第6回</text>
<text x="80" y="170" font-family="Noto Serif CJK JP" font-size="50" font-weight="bold" fill="#242321">グッドハートの法則とキャンベルの法則</text>
<text x="930" y="275" text-anchor="middle" font-family="Noto Sans CJK JP" font-size="34" font-weight="bold" fill="#2148B8">目標にして押す</text>
<line x1="930" y1="295" x2="930" y2="364" stroke="#2148B8" stroke-width="5" marker-end="url(#aa)"/>
<rect x="80" y="370" width="380" height="130" rx="14" fill="#FAFAF7" stroke="#242321" stroke-width="3"/>
<text x="270" y="450" text-anchor="middle" font-family="Noto Sans CJK JP" font-size="42" fill="#242321">目標</text>
<rect x="740" y="370" width="380" height="130" rx="14" fill="#FAFAF7" stroke="#242321" stroke-width="3"/>
<text x="930" y="450" text-anchor="middle" font-family="Noto Sans CJK JP" font-size="42" fill="#242321">指標</text>
<text x="600" y="415" text-anchor="middle" font-family="Noto Sans CJK JP" font-size="30" fill="#242321">ふだんの道筋</text>
<line x1="460" y1="445" x2="734" y2="445" stroke="#242321" stroke-width="3" marker-end="url(#ai)"/>
<rect x="740" y="610" width="380" height="150" rx="14" fill="#FAFAF7" stroke="#2148B8" stroke-width="5"/>
<text x="930" y="675" text-anchor="middle" font-family="Noto Sans CJK JP" font-size="38" font-weight="bold" fill="#2148B8">安い道筋</text>
<text x="930" y="728" text-anchor="middle" font-family="Noto Sans CJK JP" font-size="30" fill="#242321">押し入れに詰める</text>
<line x1="930" y1="610" x2="930" y2="506" stroke="#2148B8" stroke-width="5" marker-end="url(#aa)"/>
<line x1="270" y1="500" x2="270" y2="630" stroke="#242321" stroke-width="3" stroke-dasharray="10 8"/>
<text x="270" y="690" text-anchor="middle" font-family="Noto Sans CJK JP" font-size="32" fill="#242321">目標は通らない</text>
<rect x="80" y="840" width="480" height="230" rx="16" fill="#FAFAF7" stroke="#242321" stroke-width="3"/>
<text x="320" y="910" text-anchor="middle" font-family="Noto Sans CJK JP" font-size="36" font-weight="bold" fill="#242321">グッドハート</text>
<text x="320" y="975" text-anchor="middle" font-family="Noto Sans CJK JP" font-size="32" fill="#242321">指標が目標を</text>
<text x="320" y="1025" text-anchor="middle" font-family="Noto Sans CJK JP" font-size="32" fill="#242321">教えなくなる</text>
<line x1="566" y1="955" x2="634" y2="955" stroke="#242321" stroke-width="3" marker-end="url(#ai)"/>
<rect x="640" y="840" width="480" height="230" rx="16" fill="#FAFAF7" stroke="#2148B8" stroke-width="5"/>
<text x="880" y="910" text-anchor="middle" font-family="Noto Sans CJK JP" font-size="36" font-weight="bold" fill="#2148B8">キャンベル</text>
<text x="880" y="975" text-anchor="middle" font-family="Noto Sans CJK JP" font-size="32" fill="#242321">見張るはずの営み</text>
<text x="880" y="1025" text-anchor="middle" font-family="Noto Sans CJK JP" font-size="32" fill="#242321">そのものもゆがむ</text>
</svg>
