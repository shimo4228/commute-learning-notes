<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
<defs>
<marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#242321"/></marker>
<marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2148B8"/></marker>
</defs>
<rect width="1200" height="1200" fill="#FAFAF7"/>
<text x="60" y="95" font-family="Noto Sans CJK JP" font-weight="500" font-size="36" fill="#2148B8">判断と測定　第6回</text>
<text x="60" y="178" font-family="Noto Serif CJK JP" font-weight="bold" font-size="54" fill="#242321">グッドハートの法則とキャンベルの法則</text>
<rect data-step="1" x="60" y="370" width="400" height="130" rx="16" fill="#FAFAF7" stroke="#242321" stroke-width="5"/>
<text data-step="1" x="260" y="451" text-anchor="middle" font-family="Noto Sans CJK JP" font-weight="500" font-size="46" fill="#242321">目標</text>
<rect data-step="1" x="740" y="370" width="400" height="130" rx="16" fill="#FAFAF7" stroke="#242321" stroke-width="5"/>
<text data-step="1" x="940" y="451" text-anchor="middle" font-family="Noto Sans CJK JP" font-weight="500" font-size="46" fill="#242321">指標</text>
<text data-step="2" x="600" y="418" text-anchor="middle" font-family="Noto Sans CJK JP" font-weight="500" font-size="38" fill="#242321">ふだんの道筋</text>
<line data-step="2" x1="466" y1="448" x2="732" y2="448" stroke="#242321" stroke-width="5" marker-end="url(#ai)"/>
<text data-step="3" x="940" y="275" text-anchor="middle" font-family="Noto Sans CJK JP" font-weight="bold" font-size="40" fill="#2148B8">目標にして押す</text>
<line data-step="3" x1="940" y1="296" x2="940" y2="362" stroke="#2148B8" stroke-width="7" marker-end="url(#aa)"/>
<rect data-step="4" x="740" y="610" width="400" height="130" rx="16" fill="#FAFAF7" stroke="#2148B8" stroke-width="7"/>
<text data-step="4" x="940" y="690" text-anchor="middle" font-family="Noto Sans CJK JP" font-weight="bold" font-size="44" fill="#2148B8">安い道筋</text>
<line data-step="4" x1="940" y1="604" x2="940" y2="510" stroke="#2148B8" stroke-width="7" marker-end="url(#aa)"/>
<line data-step="5" x1="260" y1="506" x2="260" y2="630" stroke="#242321" stroke-width="5" stroke-dasharray="12 10"/>
<text data-step="5" x="260" y="690" text-anchor="middle" font-family="Noto Sans CJK JP" font-weight="500" font-size="38" fill="#242321">目標は通らない</text>
<rect data-step="6" x="60" y="830" width="500" height="240" rx="16" fill="#FAFAF7" stroke="#242321" stroke-width="5"/>
<text data-step="6" x="310" y="905" text-anchor="middle" font-family="Noto Sans CJK JP" font-weight="bold" font-size="44" fill="#242321">グッドハート</text>
<text data-step="6" x="310" y="975" text-anchor="middle" font-family="Noto Sans CJK JP" font-weight="500" font-size="42" fill="#242321">指標が目標を</text>
<text data-step="6" x="310" y="1030" text-anchor="middle" font-family="Noto Sans CJK JP" font-weight="500" font-size="42" fill="#242321">教えなくなる</text>
<line data-step="7" x1="566" y1="950" x2="632" y2="950" stroke="#242321" stroke-width="5" marker-end="url(#ai)"/>
<rect data-step="8" x="640" y="830" width="500" height="240" rx="16" fill="#FAFAF7" stroke="#2148B8" stroke-width="7"/>
<text data-step="8" x="890" y="905" text-anchor="middle" font-family="Noto Sans CJK JP" font-weight="bold" font-size="44" fill="#2148B8">キャンベル</text>
<text data-step="8" x="890" y="975" text-anchor="middle" font-family="Noto Sans CJK JP" font-weight="bold" font-size="42" fill="#2148B8">見張る営みも</text>
<text data-step="8" x="890" y="1030" text-anchor="middle" font-family="Noto Sans CJK JP" font-weight="bold" font-size="42" fill="#2148B8">ゆがむ</text>
</svg>
