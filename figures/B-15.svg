<text x="310" y="590" text-anchor="middle" font-family="Noto Sans CJK JP" font-weight="bold" font-size="50" fill="#242321">床</text>
<text x="310" y="657" text-anchor="middle" font-family="Noto Sans CJK JP" font-weight="500" font-size="40" fill="#242321">消せない分</text>
<text x="310" y="724" text-anchor="middle" font-family="Noto Sans CJK JP" font-weight="500" font-size="44" fill="#242321">b × (1 − b)</text>
