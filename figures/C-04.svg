<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
<defs>
<marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#242321"/></marker>
<marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#63365F"/></marker>
</defs>
<rect width="1200" height="1200" fill="#FAFAF7"/>
<text x="60" y="95" font-family="Noto Sans CJK JP" font-weight="500" font-size="36" fill="#63365F">概念工学　第4回</text>
<text x="60" y="178" font-family="Noto Serif CJK JP" font-weight="bold" font-size="60" fill="#242321">直観は証拠になるか</text>
<rect data-step="1" x="60" y="250" width="440" height="130" rx="16" fill="#FAFAF7" stroke="#242321" stroke-width="5"/>
<text data-step="1" x="280" y="331" font-size="44" text-anchor="middle" font-family="Noto Sans CJK JP" font-weight="500" fill="#242321">想定事例を読む</text>
<line data-step="2" x1="512" y1="315" x2="682" y2="315" stroke="#242321" stroke-width="5" marker-end="url(#ai)"/>
<rect data-step="2" x="700" y="250" width="440" height="130" rx="16" fill="#FAFAF7" stroke="#242321" stroke-width="5"/>
<text data-step="2" x="920" y="331" font-size="44" text-anchor="middle" font-family="Noto Sans CJK JP" font-weight="500" fill="#242321">人々の判断</text>
<text data-step="3" x="600" y="478" font-size="46" text-anchor="middle" font-family="Noto Sans CJK JP" font-weight="bold" fill="#242321">直観は何の証拠か</text>
<path data-step="3" d="M920,380 L920,530 M290,530 L920,530" fill="none" stroke="#242321" stroke-width="5"/>
<line data-step="4" x1="290" y1="530" x2="290" y2="594" stroke="#242321" stroke-width="5" stroke-dasharray="14 10" marker-end="url(#ai)"/>
<rect data-step="4" x="60" y="600" width="460" height="180" rx="16" fill="#FAFAF7" stroke="#242321" stroke-width="5" stroke-dasharray="16 10"/>
<text data-step="4" x="290" y="678" font-size="42" text-anchor="middle" font-family="Noto Sans CJK JP" font-weight="500" fill="#242321">世界の事実の</text>
<text data-step="4" x="290" y="736" font-size="42" text-anchor="middle" font-family="Noto Sans CJK JP" font-weight="500" fill="#242321">手がかり</text>
<line data-step="5" x1="920" y1="530" x2="920" y2="588" stroke="#63365F" stroke-width="7" marker-end="url(#aa)"/>
<rect data-step="5" x="700" y="600" width="440" height="180" rx="16" fill="#FAFAF7" stroke="#63365F" stroke-width="7"/>
<text data-step="5" x="920" y="678" font-size="42" text-anchor="middle" font-family="Noto Sans CJK JP" font-weight="bold" fill="#63365F">概念のいまの</text>
<text data-step="5" x="920" y="736" font-size="42" text-anchor="middle" font-family="Noto Sans CJK JP" font-weight="bold" fill="#63365F">使い方のデータ</text>
<line data-step="6" x1="920" y1="780" x2="920" y2="848" stroke="#63365F" stroke-width="7" marker-end="url(#aa)"/>
<rect data-step="6" x="60" y="860" width="1080" height="130" rx="16" fill="#FAFAF7" stroke="#242321" stroke-width="5"/>
<text data-step="6" x="600" y="941" font-size="44" text-anchor="middle" font-family="Noto Sans CJK JP" font-weight="500" fill="#242321">どう使うべきかは調査で決まらない</text>
<text data-step="7" x="600" y="1095" font-size="48" text-anchor="middle" font-family="Noto Sans CJK JP" font-weight="bold" fill="#63365F">そこを引き受ける概念工学</text>
