<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
<defs>
<marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#242321"/></marker>
<marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#008A4B"/></marker>
</defs>
<rect width="1200" height="1200" fill="#FAFAF7"/>
<text x="80" y="100" font-family="Noto Sans CJK JP" font-size="30" fill="#008A4B">確率と情報理論　第3回</text>
<text x="80" y="170" font-family="Noto Serif CJK JP" font-size="54" font-weight="bold" fill="#242321">ベイズの定理</text>
<rect x="140" y="240" width="920" height="100" rx="14" fill="#FAFAF7" stroke="#008A4B" stroke-width="4"/>
<text x="600" y="306" text-anchor="middle" font-family="Noto Sans CJK JP" font-size="44" fill="#008A4B" font-weight="bold">事後オッズ ＝ 事前オッズ × 尤度比</text>
<text x="600" y="430" text-anchor="middle" font-family="Noto Sans CJK JP" font-size="32" fill="#242321">しぼんだタイヤは、パンクか、自然に抜けたか</text>
<rect x="160" y="480" width="480" height="120" rx="14" fill="#FAFAF7" stroke="#242321" stroke-width="3"/>
<text x="330" y="558" text-anchor="middle" font-family="Noto Sans CJK JP" font-size="52" fill="#242321" font-weight="bold">1対4</text>
<text x="520" y="552" text-anchor="middle" font-family="Noto Sans CJK JP" font-size="30" fill="#242321">確率0.2</text>
<rect x="160" y="680" width="480" height="120" rx="14" fill="#FAFAF7" stroke="#242321" stroke-width="3"/>
<text x="330" y="758" text-anchor="middle" font-family="Noto Sans CJK JP" font-size="52" fill="#242321" font-weight="bold">3対4</text>
<text x="520" y="752" text-anchor="middle" font-family="Noto Sans CJK JP" font-size="30" fill="#242321">確率0.43</text>
<rect x="160" y="880" width="480" height="120" rx="14" fill="#FAFAF7" stroke="#008A4B" stroke-width="4"/>
<text x="330" y="958" text-anchor="middle" font-family="Noto Sans CJK JP" font-size="52" fill="#008A4B" font-weight="bold">3対1</text>
<text x="520" y="952" text-anchor="middle" font-family="Noto Sans CJK JP" font-size="30" fill="#242321">確率0.75</text>
<text x="110" y="554" text-anchor="end" font-family="Noto Sans CJK JP" font-size="30" fill="#242321">事前</text>
