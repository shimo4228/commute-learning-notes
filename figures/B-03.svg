<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
<defs>
<marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#242321"/></marker>
<marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#008A4B"/></marker>
</defs>
<rect width="1200" height="1200" fill="#FAFAF7"/>
<text x="60" y="95" font-family="Noto Sans CJK JP" font-weight="500" font-size="36" fill="#008A4B">確率と情報理論　第3回</text>
<text x="60" y="178" font-family="Noto Serif CJK JP" font-weight="bold" font-size="60" fill="#242321">ベイズの定理</text>
<rect data-step="1" x="60" y="230" width="1080" height="120" rx="16" fill="#FAFAF7" stroke="#008A4B" stroke-width="7"/>
<text data-step="1" x="600" y="307" text-anchor="middle" font-family="Noto Sans CJK JP" font-weight="bold" font-size="46" fill="#008A4B">事後オッズ ＝ 事前オッズ × 尤度比</text>
<text data-step="2" x="600" y="425" text-anchor="middle" font-family="Noto Sans CJK JP" font-weight="500" font-size="40" fill="#242321">タイヤはパンクか、自然に抜けたか</text>
<text data-step="3" x="60" y="560" text-anchor="start" font-family="Noto Sans CJK JP" font-weight="500" font-size="40" fill="#242321">事前</text>
<rect data-step="3" x="170" y="480" width="400" height="130" rx="16" fill="#FAFAF7" stroke="#242321" stroke-width="5"/>
<text data-step="3" x="370" y="565" text-anchor="middle" font-family="Noto Sans CJK JP" font-weight="500" font-size="56" fill="#242321">1対4</text>
<line data-step="4" x1="370" y1="615" x2="370" y2="700" stroke="#008A4B" stroke-width="7" marker-end="url(#aa)"/>
<text data-step="4" x="420" y="675" text-anchor="start" font-family="Noto Sans CJK JP" font-weight="bold" font-size="50" fill="#008A4B">×3</text>
<text data-step="4" x="510" y="672" text-anchor="start" font-family="Noto Sans CJK JP" font-weight="500" font-size="40" fill="#242321">砂利道を走った</text>
<rect data-step="5" x="170" y="705" width="400" height="130" rx="16" fill="#FAFAF7" stroke="#242321" stroke-width="5"/>
<text data-step="5" x="370" y="790" text-anchor="middle" font-family="Noto Sans CJK JP" font-weight="500" font-size="56" fill="#242321">3対4</text>
<line data-step="6" x1="370" y1="840" x2="370" y2="925" stroke="#008A4B" stroke-width="7" marker-end="url(#aa)"/>
<text data-step="6" x="420" y="900" text-anchor="start" font-family="Noto Sans CJK JP" font-weight="bold" font-size="50" fill="#008A4B">×4</text>
<text data-step="6" x="510" y="897" text-anchor="start" font-family="Noto Sans CJK JP" font-weight="500" font-size="40" fill="#242321">またしぼんだ</text>
<rect data-step="7" x="170" y="930" width="400" height="130" rx="16" fill="#FAFAF7" stroke="#008A4B" stroke-width="7"/>
<text data-step="7" x="370" y="1015" text-anchor="middle" font-family="Noto Sans CJK JP" font-weight="bold" font-size="56" fill="#008A4B">3対1</text>
<text data-step="7" x="620" y="1012" text-anchor="start" font-family="Noto Sans CJK JP" font-weight="500" font-size="42" fill="#242321">確率0.75</text>
<text data-step="8" x="600" y="1135" text-anchor="middle" font-family="Noto Sans CJK JP" font-weight="bold" font-size="42" fill="#008A4B">証拠ごとに尤度比を掛ける</text>
</svg>
