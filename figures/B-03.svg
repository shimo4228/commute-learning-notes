<text x="700" y="656" text-anchor="start" font-family="Noto Sans CJK JP" font-size="48" fill="#008A4B" font-weight="bold">×3</text>
<text x="800" y="652" text-anchor="start" font-family="Noto Sans CJK JP" font-size="32" fill="#242321">砂利道を走った</text>
<line x1="400" y1="800" x2="400" y2="876" stroke="#242321" stroke-width="3" marker-end="url(#ai)"/>
<text x="700" y="856" text-anchor="start" font-family="Noto Sans CJK JP" font-size="48" fill="#008A4B" font-weight="bold">×4</text>
<text x="800" y="852" text-anchor="start" font-family="Noto Sans CJK JP" font-size="32" fill="#242321">またしぼんだ</text>
<text x="600" y="1110" text-anchor="middle" font-family="Noto Sans CJK JP" font-size="40" fill="#008A4B" font-weight="bold">証拠が来るたびに尤度比を掛ける</text>
