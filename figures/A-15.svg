<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
<defs>
<marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#242321"/></marker>
<marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2148B8"/></marker>
</defs>
<rect width="1200" height="1200" fill="#FAFAF7"/>
<text x="60" y="95" font-family="Noto Sans CJK JP" font-weight="500" font-size="36" fill="#2148B8">判断と測定　第15回</text>
<text x="60" y="178" font-family="Noto Serif CJK JP" font-weight="bold" font-size="60" fill="#242321">直観はいつ信頼できるか</text>
<rect x="60" y="250" width="500" height="170" rx="16" fill="#FAFAF7" stroke="#242321" stroke-width="5"/>
<text x="310" y="322" text-anchor="middle" font-family="Noto Sans CJK JP" font-weight="500" font-size="46" fill="#242321">規則性のある場</text>
<text x="310" y="388" text-anchor="middle" font-family="Noto Sans CJK JP" font-weight="500" font-size="36" fill="#242321">手がかりと結果がつながる</text>
<rect x="640" y="250" width="500" height="170" rx="16" fill="#FAFAF7" stroke="#242321" stroke-width="5"/>
<text x="890" y="322" text-anchor="middle" font-family="Noto Sans CJK JP" font-weight="500" font-size="46" fill="#242321">学ぶ機会と手応え</text>
<text x="890" y="388" text-anchor="middle" font-family="Noto Sans CJK JP" font-weight="500" font-size="36" fill="#242321">速くはっきりした知らせ</text>
<line x1="330" y1="432" x2="520" y2="590" stroke="#242321" stroke-width="5" marker-end="url(#ai)"/>
<line x1="870" y1="432" x2="680" y2="590" stroke="#242321" stroke-width="5" marker-end="url(#ai)"/>
<text x="600" y="520" text-anchor="middle" font-family="Noto Sans CJK JP" font-weight="500" font-size="38" fill="#242321">外から確かめる</text>
<rect x="240" y="600" width="720" height="150" rx="16" fill="#FAFAF7" stroke="#2148B8" stroke-width="7"/>
<text x="600" y="693" text-anchor="middle" font-family="Noto Sans CJK JP" font-weight="bold" font-size="52" fill="#2148B8">当てにしてよい直観</text>
<rect x="60" y="880" width="500" height="170" rx="16" fill="#FAFAF7" stroke="#242321" stroke-width="5"/>
<text x="310" y="980" text-anchor="middle" font-family="Noto Sans CJK JP" font-weight="500" font-size="44" fill="#242321">本人の自信の強さ</text>
<text x="860" y="960" text-anchor="middle" font-family="Noto Sans CJK JP" font-weight="500" font-size="42" fill="#242321">当たりの印に</text>
<text x="860" y="1020" text-anchor="middle" font-family="Noto Sans CJK JP" font-weight="500" font-size="42" fill="#242321">ならない</text>
</svg>
