<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
<defs>
<marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#242321"/></marker>
<marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#63365F"/></marker>
</defs>
<rect width="1200" height="1200" fill="#FAFAF7"/>
<text x="60" y="95" font-family="Noto Sans CJK JP" font-weight="500" font-size="36" fill="#63365F">概念工学　第8回</text>
<text x="60" y="178" font-family="Noto Serif CJK JP" font-weight="bold" font-size="60" fill="#242321">実装の問題</text>
<rect data-step="1" x="200" y="240" width="800" height="120" rx="16" fill="#FAFAF7" stroke="#242321" stroke-width="5"/>
<text data-step="1" x="600" y="316" font-size="44" text-anchor="middle" font-family="Noto Sans CJK JP" font-weight="500" fill="#242321">制度が範囲の中で定義する</text>
<line data-step="2" x1="600" y1="360" x2="600" y2="408" stroke="#242321" stroke-width="5" marker-end="url(#ai)"/>
<text data-step="2" x="600" y="462" font-size="40" text-anchor="middle" font-family="Noto Sans CJK JP" font-weight="500" fill="#242321">範囲の中では効く</text>
<line data-step="3" x1="600" y1="482" x2="600" y2="528" stroke="#242321" stroke-width="5" stroke-dasharray="8 6" marker-end="url(#ai)"/>
<rect data-step="3" x="200" y="540" width="800" height="120" rx="16" fill="#FAFAF7" stroke="#63365F" stroke-width="7"/>
<text data-step="3" x="600" y="617" font-size="46" text-anchor="middle" font-family="Noto Sans CJK JP" font-weight="bold" fill="#63365F">日常の言葉に競争相手は</text>
<path data-step="4" d="M600,660 L600,720 M310,720 L600,720" fill="none" stroke="#242321" stroke-width="5"/>
<path data-step="6" d="M600,720 L890,720" fill="none" stroke="#242321" stroke-width="5"/>
<line data-step="4" x1="310" y1="720" x2="310" y2="808" stroke="#242321" stroke-width="5" marker-end="url(#ai)"/>
<text data-step="4" x="285" y="782" font-size="40" text-anchor="end" font-family="Noto Sans CJK JP" font-weight="500" fill="#242321">いる</text>
<rect data-step="5" x="60" y="820" width="500" height="200" rx="16" fill="#FAFAF7" stroke="#242321" stroke-width="5"/>
<text data-step="5" x="310" y="905" font-size="42" text-anchor="middle" font-family="Noto Sans CJK JP" font-weight="500" fill="#242321">外には根づきにくい</text>
<text data-step="5" x="310" y="972" font-size="42" text-anchor="middle" font-family="Noto Sans CJK JP" font-weight="500" fill="#242321">大会の「初心者」</text>
<line data-step="6" x1="890" y1="720" x2="890" y2="802" stroke="#63365F" stroke-width="7" marker-end="url(#aa)"/>
<text data-step="6" x="915" y="782" font-size="40" font-family="Noto Sans CJK JP" font-weight="bold" fill="#63365F">いない</text>
<rect data-step="7" x="640" y="820" width="500" height="200" rx="16" fill="#FAFAF7" stroke="#63365F" stroke-width="7"/>
<text data-step="7" x="890" y="905" font-size="42" text-anchor="middle" font-family="Noto Sans CJK JP" font-weight="bold" fill="#63365F">外へ出ていきうる</text>
<text data-step="7" x="890" y="972" font-size="42" text-anchor="middle" font-family="Noto Sans CJK JP" font-weight="bold" fill="#63365F">「くじ組みの部」</text>
</svg>
