<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
<defs>
<marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#242321"/></marker>
<marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#63365F"/></marker>
</defs>
<rect width="1200" height="1200" fill="#FAFAF7"/>
<text x="80" y="100" font-family="Noto Sans CJK JP" font-size="30" fill="#63365F">概念工学　第8回</text>
<text x="80" y="170" font-family="Noto Serif CJK JP" font-size="54" font-weight="bold" fill="#242321">実装の問題</text>
<rect x="300" y="250" width="600" height="110" rx="14" fill="#FAFAF7" stroke="#242321" stroke-width="3"/>
<text x="600" y="318" text-anchor="middle" font-family="Noto Sans CJK JP" font-size="38" fill="#242321">制度が範囲の中で定義する</text>
<line x1="600" y1="360" x2="600" y2="404" stroke="#242321" stroke-width="3" marker-end="url(#ai)"/>
<text x="600" y="452" text-anchor="middle" font-family="Noto Sans CJK JP" font-size="34" fill="#242321">範囲の中では効く</text>
<line x1="600" y1="476" x2="600" y2="524" stroke="#242321" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#ai)"/>
<rect x="300" y="530" width="600" height="110" rx="14" fill="#FAFAF7" stroke="#63365F" stroke-width="5"/>
<text x="600" y="598" text-anchor="middle" font-family="Noto Sans CJK JP" font-size="38" font-weight="bold" fill="#63365F">日常の言葉に競争相手は</text>
<path d="M310,700 L890,700" fill="none" stroke="#242321" stroke-width="3"/>
<line x1="600" y1="640" x2="600" y2="700" stroke="#242321" stroke-width="3"/>
<line x1="310" y1="700" x2="310" y2="794" stroke="#242321" stroke-width="3" marker-end="url(#ai)"/>
<line x1="890" y1="700" x2="890" y2="794" stroke="#63365F" stroke-width="4" marker-end="url(#aa)"/>
<text x="290" y="760" text-anchor="end" font-family="Noto Sans CJK JP" font-size="32" fill="#242321">いる</text>
<text x="910" y="760" font-family="Noto Sans CJK JP" font-size="32" fill="#63365F">いない</text>
<rect x="80" y="800" width="460" height="170" rx="14" fill="#FAFAF7" stroke="#242321" stroke-width="3"/>
<text x="310" y="874" text-anchor="middle" font-family="Noto Sans CJK JP" font-size="36" fill="#242321">外には根づきにくい</text>
<text x="310" y="932" text-anchor="middle" font-family="Noto Sans CJK JP" font-size="30" fill="#242321">大会の「初心者」</text>
<rect x="660" y="800" width="460" height="170" rx="14" fill="#FAFAF7" stroke="#63365F" stroke-width="5"/>
<text x="890" y="874" text-anchor="middle" font-family="Noto Sans CJK JP" font-size="36" font-weight="bold" fill="#63365F">外へ出ていきうる</text>
<text x="890" y="932" text-anchor="middle" font-family="Noto Sans CJK JP" font-size="30" fill="#63365F">「くじ組みの部」</text>
<text x="600" y="1080" text-anchor="middle" font-family="Noto Sans CJK JP" font-size="32" fill="#242321">法の上の「人」でも日常の「人」は変わらない</text>
</svg>
