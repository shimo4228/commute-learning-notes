<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
<rect width="1200" height="1200" fill="#FAFAF7"/>
<text x="60" y="95" font-family="Noto Sans CJK JP" font-weight="500" font-size="36" fill="#2148B8">判断と測定　第7回</text>
<text x="60" y="178" font-family="Noto Serif CJK JP" font-weight="bold" font-size="60" fill="#242321">グッドハートの四類型</text>
<text data-step="1" x="310" y="295" text-anchor="middle" font-family="Noto Sans CJK JP" font-weight="bold" font-size="44" fill="#242321">選ぶだけ</text>
<rect data-step="2" x="60" y="350" width="500" height="300" rx="16" fill="#FAFAF7" stroke="#242321" stroke-width="5"/>
<text data-step="2" x="310" y="470" text-anchor="middle" font-family="Noto Serif CJK JP" font-weight="bold" font-size="56" fill="#242321">回帰的</text>
<text data-step="2" x="310" y="565" text-anchor="middle" font-family="Noto Sans CJK JP" font-weight="500" font-size="42" fill="#242321">外れも選ばれる</text>
<rect data-step="3" x="60" y="750" width="500" height="300" rx="16" fill="#FAFAF7" stroke="#242321" stroke-width="5"/>
<text data-step="3" x="310" y="870" text-anchor="middle" font-family="Noto Serif CJK JP" font-weight="bold" font-size="56" fill="#242321">極端</text>
<text data-step="3" x="310" y="965" text-anchor="middle" font-family="Noto Sans CJK JP" font-weight="500" font-size="42" fill="#242321">端で関係が変わる</text>
<line data-step="4" x1="600" y1="245" x2="600" y2="1100" stroke="#242321" stroke-width="5" stroke-dasharray="12 12"/>
<text data-step="4" x="890" y="295" text-anchor="middle" font-family="Noto Sans CJK JP" font-weight="bold" font-size="44" fill="#2148B8">手を入れる</text>
<rect data-step="5" x="640" y="350" width="500" height="300" rx="16" fill="#FAFAF7" stroke="#2148B8" stroke-width="7"/>
<text data-step="5" x="890" y="470" text-anchor="middle" font-family="Noto Serif CJK JP" font-weight="bold" font-size="56" fill="#2148B8">因果的</text>
<text data-step="5" x="890" y="565" text-anchor="middle" font-family="Noto Sans CJK JP" font-weight="bold" font-size="42" fill="#2148B8">道筋が切れる</text>
<rect data-step="6" x="640" y="750" width="500" height="300" rx="16" fill="#FAFAF7" stroke="#2148B8" stroke-width="7"/>
<text data-step="6" x="890" y="870" text-anchor="middle" font-family="Noto Serif CJK JP" font-weight="bold" font-size="56" fill="#2148B8">敵対的</text>
<text data-step="6" x="890" y="965" text-anchor="middle" font-family="Noto Sans CJK JP" font-weight="bold" font-size="42" fill="#2148B8">相手が指標を学ぶ</text>
</svg>
