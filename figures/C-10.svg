<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
<defs>
<marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#242321"/></marker>
<marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#63365F"/></marker>
</defs>
<rect width="1200" height="1200" fill="#FAFAF7"/>
<text x="60" y="95" font-family="Noto Sans CJK JP" font-weight="500" font-size="36" fill="#63365F">概念工学　第10回</text>
<text x="60" y="178" font-family="Noto Serif CJK JP" font-weight="bold" font-size="60" fill="#242321">言葉の争い</text>
<rect data-step="1" x="260" y="230" width="680" height="110" rx="16" fill="#FAFAF7" stroke="#242321" stroke-width="5"/>
<text data-step="1" x="600" y="301" text-anchor="middle" font-family="Noto Sans CJK JP" font-weight="500" font-size="46" fill="#242321">言い合いが続く</text>
<line data-step="2" x1="600" y1="340" x2="600" y2="443" stroke="#63365F" stroke-width="7" marker-end="url(#aa)"/>
<text data-step="2" x="570" y="408" text-anchor="end" font-family="Noto Sans CJK JP" font-weight="bold" font-size="44" fill="#63365F">消去法</text>
<text data-step="2" x="630" y="406" font-family="Noto Sans CJK JP" font-weight="bold" font-size="40" fill="#63365F">鍵の語と近い語を禁じる</text>
<rect data-step="3" x="60" y="455" width="1080" height="120" rx="16" fill="#FAFAF7" stroke="#63365F" stroke-width="7"/>
<text data-step="3" x="600" y="532" text-anchor="middle" font-family="Noto Sans CJK JP" font-weight="bold" font-size="48" fill="#63365F">割れている文が残るか</text>
<line data-step="4" x1="150" y1="575" x2="150" y2="680" stroke="#242321" stroke-width="5"/>
<line data-step="4" x1="150" y1="680" x2="718" y2="680" stroke="#242321" stroke-width="5" marker-end="url(#ai)"/>
<text data-step="4" x="190" y="655" font-family="Noto Sans CJK JP" font-weight="500" font-size="40" fill="#242321">残る</text>
<rect data-step="5" x="730" y="615" width="410" height="130" rx="16" fill="#FAFAF7" stroke="#242321" stroke-width="5"/>
<text data-step="5" x="935" y="696" text-anchor="middle" font-family="Noto Sans CJK JP" font-weight="500" font-size="46" fill="#242321">事実の争い</text>
<line data-step="6" x1="150" y1="680" x2="150" y2="850" stroke="#242321" stroke-width="5"/>
<line data-step="6" x1="150" y1="850" x2="718" y2="850" stroke="#242321" stroke-width="5" marker-end="url(#ai)"/>
<text data-step="6" x="190" y="825" font-family="Noto Sans CJK JP" font-weight="500" font-size="40" fill="#242321">残らない</text>
<rect data-step="7" x="730" y="785" width="410" height="130" rx="16" fill="#FAFAF7" stroke="#63365F" stroke-width="7"/>
<text data-step="7" x="935" y="866" text-anchor="middle" font-family="Noto Sans CJK JP" font-weight="bold" font-size="46" fill="#63365F">言葉の争い</text>
<line data-step="8" x1="150" y1="850" x2="150" y2="1020" stroke="#242321" stroke-width="5"/>
<line data-step="8" x1="150" y1="1020" x2="718" y2="1020" stroke="#242321" stroke-width="5" marker-end="url(#ai)"/>
<text data-step="8" x="190" y="995" font-family="Noto Sans CJK JP" font-weight="500" font-size="40" fill="#242321">近い語でしか言えない</text>
<rect data-step="9" x="730" y="955" width="410" height="130" rx="16" fill="#FAFAF7" stroke="#242321" stroke-width="5"/>
<text data-step="9" x="935" y="1036" text-anchor="middle" font-family="Noto Sans CJK JP" font-weight="500" font-size="46" fill="#242321">岩盤の争い</text>
</svg>
