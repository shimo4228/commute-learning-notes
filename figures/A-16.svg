<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
<defs>
<marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#242321"/></marker>
<marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2148B8"/></marker>
</defs>
<rect width="1200" height="1200" fill="#FAFAF7"/>
<text x="60" y="95" font-family="Noto Sans CJK JP" font-weight="500" font-size="36" fill="#2148B8">判断と測定　第16回</text>
<text x="60" y="178" font-family="Noto Serif CJK JP" font-weight="bold" font-size="60" fill="#242321">規則は自らの適用を決めない</text>
<rect x="160" y="240" width="880" height="125" rx="16" fill="#FAFAF7" stroke="#242321" stroke-width="5"/>
<text x="600" y="317" text-anchor="middle" font-family="Noto Sans CJK JP" font-weight="500" font-size="44" fill="#242321">「2を足せ」と1000までの練習</text>
<line x1="480" y1="377" x2="330" y2="452" stroke="#242321" stroke-width="5" marker-end="url(#ai)"/>
<line x1="720" y1="377" x2="870" y2="452" stroke="#242321" stroke-width="5" marker-end="url(#ai)"/>
<rect x="60" y="462" width="500" height="125" rx="16" fill="#FAFAF7" stroke="#242321" stroke-width="5"/>
<text x="310" y="540" text-anchor="middle" font-family="Noto Sans CJK JP" font-weight="500" font-size="46" fill="#242321">次は1002</text>
<rect x="640" y="462" width="500" height="125" rx="16" fill="#FAFAF7" stroke="#242321" stroke-width="5"/>
<text x="890" y="540" text-anchor="middle" font-family="Noto Sans CJK JP" font-weight="500" font-size="46" fill="#242321">次は1004</text>
<text x="600" y="655" text-anchor="middle" font-family="Noto Sans CJK JP" font-weight="500" font-size="40" fill="#242321">どちらも練習と食い違わない</text>
<rect x="160" y="700" width="880" height="125" rx="16" fill="#FAFAF7" stroke="#242321" stroke-width="5"/>
<text x="600" y="778" text-anchor="middle" font-family="Noto Sans CJK JP" font-weight="500" font-size="44" fill="#242321">解釈を足しても読み方が要る</text>
<line x1="600" y1="837" x2="600" y2="905" stroke="#2148B8" stroke-width="7" marker-end="url(#aa)"/>
<rect x="200" y="915" width="800" height="175" rx="16" fill="#FAFAF7" stroke="#2148B8" stroke-width="7"/>
<text x="600" y="995" text-anchor="middle" font-family="Noto Sans CJK JP" font-weight="bold" font-size="50" fill="#2148B8">規則に従うことは実践</text>
<text x="600" y="1058" text-anchor="middle" font-family="Noto Sans CJK JP" font-weight="bold" font-size="42" fill="#2148B8">判断の一致が支える</text>
</svg>
